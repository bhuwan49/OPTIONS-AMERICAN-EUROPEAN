[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optnlib"
version = "0.1.0"
description = "European and American option pricing, Monte Carlo simulation, implied volatility, and greeks for options with continuous or discrete dividends."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = { text = "MIT" }
authors = [{ name = "optnlib" }]
keywords = ["options", "american", "european", "black-scholes", "bjerksund", "monte-carlo", "simulation", "implied-volatility", "greeks", "volatility-smile", "volatility-surface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy>=1.22", "scipy>=1.7"]

[project.optional-dependencies]
ridge = ["scikit-learn>=1.0"]
market = ["pandas>=1.5", "yfinance>=0.2", "openpyxl>=3.0"]
viz = ["matplotlib>=3.5", "plotly>=5.0"]
vol = [
    "pandas>=1.5",
    "yfinance>=0.2",
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "plotly>=5.0",
]
dev = ["pytest>=7.0", "scikit-learn>=1.0", "pandas>=1.5", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["optnlib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:overflow encountered in dot:RuntimeWarning",
]
