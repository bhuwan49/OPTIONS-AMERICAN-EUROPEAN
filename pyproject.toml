[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optnlib"
version = "0.1.0"
description = "European and American option pricing, implied volatility, and greeks for options with continuous or discrete dividends."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = { text = "MIT" }
authors = [{ name = "optnlib" }]
keywords = ["options", "american", "european", "black-scholes", "bjerksund", "implied-volatility", "greeks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["numpy>=1.22", "scipy>=1.7"]

[project.optional-dependencies]
ridge = ["scikit-learn>=1.0"]
dev = ["pytest>=7.0", "scikit-learn>=1.0"]

[tool.setuptools.packages.find]
include = ["optnlib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
